[workspace]
members = ["."]
resolver = "2"

[package]
name = "unicodd-unicode-15"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
icu_normalizer = { version = "=1.5.0", default-features = false, features = ["compiled_data"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
