[package]
name = "unicodd-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
unicode-normalization = "0.1.25"
icu_normalizer = "=1.5.0"
unicode_names2 = "=1.2.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde_json = "1"
wasm-bindgen = "=0.2.130"

[dev-dependencies]
serde_json = "1"
