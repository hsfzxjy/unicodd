[package]
name = "unicode-indexer"
version = "0.1.0"
edition = "2024"
description = "Build-time Unicode relationship index generator for unicodd"
publish = false

[dependencies]
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
unicode_names2 = "=4.0.0"
